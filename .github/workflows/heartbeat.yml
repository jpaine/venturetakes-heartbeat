name: Venturetakes ingest heartbeat
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
concurrency:
  group: venturetakes-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run ingestion if content is stale (public endpoint, no secret)
        run: |
          code=$(curl -sS -o out.json -w "%{http_code}" --max-time 280 -X POST \
            -H "User-Agent: Venturetakes-heartbeat-gha/1.0" \
            "https://www.venturetakes.com/api/ingest/run-if-stale")
          echo "HTTP $code"; cat out.json; echo
          case "$code" in 200|429) exit 0;; *) exit 1;; esac
